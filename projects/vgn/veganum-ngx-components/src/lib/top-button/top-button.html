<div style="height: 150vh; background: linear-gradient(to bottom, #f0f0f0, #e0e0e0)">
  <h1>Contenido de prueba</h1>
  <p>Haz scroll hacia abajo para ver el botón...</p>

  <div style="height: 100vh; display: flex; align-items: center; justify-content: center">
    <p>Continúa haciendo scroll...</p>
  </div>
</div>

@if (showButton()) {
<button
  id="myBtn"
  title="Ir arriba"
  [ngStyle]="{ 'background-color': color }"
  (click)="scrollToTop()"
>
  <svg
    @if(showIcon)
    xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink"
    width="20px"
    height="20px"
    viewBox="-5 -4 25 15"
    xml:space="preserve"
  >
    <polyline
      fill="none"
      stroke="#ffffff"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
      points="0,7 7,0 15,7"
    />
  </svg>
  <span @if(!showIcon)>{{ text }}</span>
</button>
}
